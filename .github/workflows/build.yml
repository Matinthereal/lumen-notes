name: build

on:
  push:
    branches: [main, mobile]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  # Newest Qt aqt can install on Windows: Qt split the Windows repo into per-arch
  # folders in 6.11 (qt6_6112_msvc2022_64/ etc.), and aqtinstall 3.3.0 still asks
  # for the old combined Updates.xml, so 6.11+ 404s on windows_x86. Revisit when
  # aqt learns the new layout.
  QT_VERSION: 6.10.3
  # QtQuick's shader baker (qsb) and the virtual keyboard used in tablet mode are addon modules;
  # everything else (Core/Gui/Quick/Qml/Network/Test) ships with the base Qt install.
  QT_MODULES: qtshadertools qtvirtualkeyboard

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev pkg-config patchelf

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # No .venv here, so the tests that shell out to the Python ML workers (pymupdf, faster-whisper,
      # pix2tex/transformers) can't pass; app_ui (--uitest) is a slower full sweep run separately in
      # dev, not on every push. Everything else -- storage, ink, canvas, the ping worker, app_smoke --
      # only needs Qt and a plain Python 3, both of which this runner has.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -E '^(app_ui|pdf|audio|ocr|maths|papers)$'

      - name: Install into AppDir
        run: cmake --install build --prefix "${{ github.workspace }}/AppDir/usr"

      - name: Build AppImage
        env:
          QML_SOURCES_PATHS: ${{ github.workspace }}/app/qml
          # The bundled linuxdeploy-plugin-qt ships an old `strip` that can choke on RELR
          # relocations from a newer toolchain (seen locally on Fedora 44); skip stripping rather
          # than risk it failing the build over a few MB of debug symbols.
          NO_STRIP: 1
          # linuxdeploy-plugin-qt only bundles the platform plugin it sees linked (xcb); the app's
          # own headless tests and --screenshot need offscreen too.
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
          # linuxdeploy's own bundled patchelf is old enough to corrupt the RELR relocations a
          # current toolchain emits (segfaults on load, discovered testing this workflow locally) --
          # use the runner's own current patchelf instead.
          PATCHELF: /usr/bin/patchelf
        run: |
          mkdir -p build/tools && cd build/tools
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          cd "${{ github.workspace }}"
          ./build/tools/linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir --executable AppDir/usr/bin/lumen \
            --desktop-file packaging/lumen-notes.desktop --icon-file packaging/lumen-notes.svg \
            --plugin qt --output appimage

      # Proves the AppImage actually starts and finds its QML/workers, not just that it built.
      - name: Smoke-test AppImage
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: 1
          LUMEN_DATA_DIR: ${{ github.workspace }}/appimage-smoke-data
        run: |
          appimage=$(echo ./Lumen*.AppImage)
          "$appimage" --appimage-extract-and-run --smoke

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-linux-appimage
          path: Lumen*.AppImage

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      # No system sqlite3/pkg-config on Windows, and the KWin/Plasma D-Bus tablet-mode integration
      # is Linux-only -- see the LUMEN_BUNDLED_SQLITE and LUMEN_ENABLE_DBUS options in CMakeLists.txt.
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUMEN_BUNDLED_SQLITE=ON -DLUMEN_ENABLE_DBUS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -E '^(app_ui|pdf|audio|ocr|maths|papers)$'

      - name: Install
        run: cmake --install build --prefix "${{ github.workspace }}\install"

      - name: windeployqt
        run: windeployqt --qmldir app\qml "${{ github.workspace }}\install\lumen.exe"

      - name: Build installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DLumenInstallDir="${{ github.workspace }}\install" packaging\windows\lumen.iss

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-windows-installer
          path: packaging/windows/Output/Lumen-Setup-*.exe

  # Android tablets (ADR mynotes-002): an arm64 release APK, built exactly as scripts/setup-android.sh
  # builds it locally. Signed only when the repository has the signing secrets; without them the
  # artifact is unsigned and cannot be installed.
  android:
    runs-on: ubuntu-24.04
    env:
      QT_DIR: ${{ github.workspace }}/Qt
      JDK_DIR: ${{ github.workspace }}/jdk-17
      JAVA_HOME: ${{ github.workspace }}/jdk-17
      ANDROID_EMULATOR: 0
      QT_ANDROID_ARCHS: android_arm64_v8a
    steps:
      - uses: actions/checkout@v4

      - name: Install the Android toolchain and Qt for Android
        run: |
          pipx install aqtinstall==3.3.0
          QT_VERSION=${{ env.QT_VERSION }} bash scripts/setup-android.sh

      - name: Configure
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          "$QT_DIR/${{ env.QT_VERSION }}/android_arm64_v8a/bin/qt-cmake" -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DQT_HOST_PATH="$QT_DIR/${{ env.QT_VERSION }}/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

      - name: Build
        run: cmake --build build-android --parallel

      - name: Sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          version=$(sed -n 's/^project(lumen VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          unsigned=build-android/app/android-build/build/outputs/apk/release/android-build-release-unsigned.apk
          "$bt/zipalign" -f -p 4 "$unsigned" aligned.apk
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.jks
            "$bt/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
              --out "Lumen-$version-android.apk" aligned.apk
            rm release.jks
            "$bt/apksigner" verify "Lumen-$version-android.apk"
          else
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: the APK is unsigned"
            mv aligned.apk "Lumen-$version-android-unsigned.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-android-apk
          path: Lumen-*-android*.apk

  # iPad: Xcode builds need a Mac, so this is the only place the iOS app is built. It is unsigned;
  # Sideloadly (or AltStore) signs it with the installer's own Apple ID when it goes on the iPad.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt for iOS
        run: |
          pipx install aqtinstall==3.3.0
          aqt install-qt mac desktop ${{ env.QT_VERSION }} clang_64 -O "$RUNNER_TEMP/Qt"
          aqt install-qt mac ios ${{ env.QT_VERSION }} ios -O "$RUNNER_TEMP/Qt"

      - name: Configure
        run: |
          qt="$RUNNER_TEMP/Qt/${{ env.QT_VERSION }}"
          "$qt/ios/bin/qt-cmake" -B build-ios -G Xcode -DQT_HOST_PATH="$qt/macos" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build-ios --config Release -- -sdk iphoneos -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package the IPA
        run: |
          version=$(sed -n 's/^project(lumen VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          app=$(find build-ios -maxdepth 4 -path '*Release-iphoneos/Lumen.app' | head -1)
          test -n "$app" && test -f "$app/Frameworks/libpdfium.dylib"
          mkdir Payload && cp -R "$app" Payload/
          zip -qry "Lumen-$version-ipad-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-ipad-ipa
          path: Lumen-*-ipad-unsigned.ipa

  release:
    needs: [linux, windows, android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # The repository's default token is read-only; making a release needs write. v0.1.0's release
    # step failed with 403 "Resource not accessible by integration" for want of this.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lumen-linux-appimage/Lumen*.AppImage
            dist/lumen-windows-installer/Lumen-Setup-*.exe
            dist/lumen-android-apk/Lumen-*-android*.apk
            dist/lumen-ipad-ipa/Lumen-*-ipad-unsigned.ipa
